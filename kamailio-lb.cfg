listen=udp:0.0.0.0:5062 advertise 172.30.0.10:5062
listen=tcp:0.0.0.0:5062 advertise 172.30.0.10:5062

####### Global Parameters #########
#debug=2  # Log level as requested
#log_stderror=yes

####### Modules Section ##########
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "dispatcher.so"
loadmodule "textops.so"
loadmodule "ctl.so"
loadmodule "xlog.so"
loadmodule "rtpproxy.so"
loadmodule "avpops.so"

children=32
####### Module Configurations #########
modparam("tm", "auto_inv_100", 0)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
#modparam("dispatcher", "ds_ping_interval", 5)
#modparam("dispatcher", "ds_ping_method", "OPTIONS")
modparam("dispatcher", "ds_probing_mode", 1)
#modparam("dispatcher", "ds_ping_from", "sip:pinger@172.30.0.10:5062")
modparam("dispatcher", "ds_probing_threshold", 2)

####### Request Routing #########
request_route {
    # Handle CANCEL requests
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        }
        exit;
    }

    # Handle SIP OPTIONS requests (used for monitoring)
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # If this is a mid-dialog request, relay it statelessly
    if (loose_route()) {
        xlog("L_INFO", "Loose routing, relaying message");
        if (!ds_select_dst("1", "0")) {  # Use algorithm 8 (hash on Call-ID)
            xlog("L_ERROR", "No destinations available for mid-dialog request");
            sl_send_reply("500", "No destinations available");
            exit;
        }
        forward();
        exit;
    }

    # Handle INVITE requests - stateless forwarding
    if (is_method("INVITE")) {
        if (!ds_select_dst("1", "0")) {  # Use algorithm 8 (hash on Call-ID)
            xlog("L_ERROR", "No destinations available for INVITE");
            sl_send_reply("500", "No destinations available");
            exit;
        }

        xlog("L_INFO", "Statelessly forwarding INVITE");
        forward();
        exit;
    }

    # Handle ACK requests - stateless forwarding
    if (is_method("ACK")) {
        if (!ds_select_dst("1", "0")) {  # Use algorithm 8 (hash on Call-ID)
            xlog("L_ERROR", "No destinations available for ACK");
            exit;
        }

        xlog("L_INFO", "Statelessly forwarding ACK");
        forward();
        exit;
    }

    # All other requests should be relayed statelessly
    if (!ds_select_dst("1", "0")) {
        xlog("L_ERROR", "No destinations available for other request");
        sl_send_reply("500", "No destinations available");
        exit;
    }
    xlog("L_INFO", "Statelessly forwarding other request");
    forward();
    exit;
}
