#!KAMAILIO

####### Global Parameters #########
#listen=udp:0.0.0.0:5060
#listen=tcp:0.0.0.0:5060
# Add debug logging
#debug=4
#log_stderror=yes
####### Modules Section ##########
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
children=32

####### Request Routing Logic #########
request_route {
    # Basic sanity checks
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    
    # Handle OPTIONS for monitoring/pinging from load balancer
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK - Node Ready");
        exit;
    }
    
    # Log incoming INVITE requests
    if (is_method("INVITE")) {
        # You can customize this to identify which node is responding
        # For Node 1
        xlog("L_INFO", "Node 1 received INVITE from $si:$sp to $ru\n");
  
        sl_send_reply("302", "OK from Node 1"); 
        exit;
    }
    # For all other requests, simply reply
    sl_send_reply("200", "OK - Request Handled");
    exit;    
}
